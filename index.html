<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siempre tú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #07040a;
    --rosa: #ff5c8a;
    --rosa-suave: #ffb3c8;
    --texto: #f6e9ee;
    --tenue: #a8939c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(255, 70, 130, .10), transparent 70%),
      radial-gradient(ellipse at center, #120812 0%, var(--fondo) 70%);
    background-color: var(--fondo);
    color: var(--texto);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Lluvia binaria del fondo */
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 3s ease; }
  body.digital #fondo { opacity: 1; }

  .escena {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 3.5vh, 34px);
    padding: 16px;
  }

  /* Marco de la foto */
  .marco {
    position: relative;
    border-radius: 18px;
    opacity: 0; transform: scale(.96); filter: blur(8px);
    transition: opacity 1.6s ease, transform 1.8s cubic-bezier(.2,.7,.2,1), filter 1.6s ease;
  }
  .marco.visible { opacity: 1; transform: none; filter: none; }
  .marco::before {             /* halo detrás de la foto */
    content: ""; position: absolute; inset: -18%;
    background: radial-gradient(closest-side, rgba(255, 92, 138, .28), transparent);
    filter: blur(30px); z-index: -1; opacity: .5;
    transition: opacity 3s ease;
  }
  body.digital .marco::before { opacity: 1; animation: latido 2.6s ease-in-out infinite; }
  #lienzo { display: block; border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); transition: box-shadow 2s; }
  body.digital #lienzo { box-shadow: none; filter: drop-shadow(0 0 6px rgba(255, 92, 138, .35)); }

  @keyframes latido {
    0%, 100% { transform: scale(1); opacity: .75; }
    14%      { transform: scale(1.05); opacity: 1; }
    28%      { transform: scale(1); opacity: .8; }
    42%      { transform: scale(1.04); opacity: .95; }
  }

  /* Mensaje */
  .mensaje {
    max-width: min(620px, 92vw);
    text-align: center;
    min-height: 9.5em;
  }
  .binario {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 300;
    font-size: clamp(13px, 1.6vw, 15px);
    letter-spacing: .35em;
    color: var(--rosa-suave);
    text-shadow: 0 0 12px rgba(255, 92, 138, .6);
    min-height: 1.4em;
    margin-bottom: .7em;
  }
  .binario .cursor {
    display: inline-block; width: .55em; height: 1.05em; margin-left: .15em;
    background: var(--rosa); vertical-align: -0.15em;
    box-shadow: 0 0 10px var(--rosa);
    animation: parpadeo 1s steps(1) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }

  .frase {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(22px, 3.4vw, 34px);
    line-height: 1.32;
    color: var(--texto);
  }
  .frase .p {
    display: inline-block;
    opacity: 0; filter: blur(10px); transform: translateY(10px);
    transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .frase .p.on { opacity: 1; filter: blur(0); transform: none; }
  .frase .clave {
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 92, 138, .75);
  }

  .firma {
    margin-top: 1.4em;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .4em; text-transform: uppercase;
    color: var(--tenue);
    opacity: 0; transform: translateY(6px);
    transition: opacity 2s ease, transform 2s ease;
  }
  .firma.on { opacity: 1; transform: none; }
  .firma .corazon { display: inline-block; letter-spacing: 0; margin-left: .3em; animation: latido-corazon 1.6s ease-in-out infinite; }
  @keyframes latido-corazon {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.18); }
  }

  /* Botón repetir */
  #repetir {
    position: fixed; right: 18px; bottom: 18px; z-index: 2;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--tenue); font-size: 18px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 1s, color .3s, border-color .3s, transform .4s;
  }
  #repetir.on { opacity: 1; pointer-events: auto; }
  #repetir:hover { color: #fff; border-color: var(--rosa); transform: rotate(-90deg); }

  /* Corazoncitos que suben al final */
  .chispa {
    position: fixed; bottom: -20px; pointer-events: none; z-index: 0;
    font-family: "JetBrains Mono", monospace; color: var(--rosa);
    text-shadow: 0 0 8px var(--rosa);
    animation: subir linear forwards;
  }
  @keyframes subir {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: .7; }
    100% { transform: translateY(-105vh) translateX(var(--deriva)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .frase .p, .firma, .marco { transition-duration: .01s; }
  }
</style>
</head>
<body>

<canvas id="fondo"></canvas>

<main class="escena">
  <div class="marco" id="marco"><canvas id="lienzo"></canvas></div>

  <section class="mensaje" aria-live="polite">
    <p class="binario" id="binario"></p>
    <p class="frase" id="frase"></p>
    <p class="firma" id="firma">Siempre tú.<span class="corazon">❤️</span></p>
  </section>
</main>

<button id="repetir" title="Ver de nuevo" aria-label="Ver de nuevo">↻</button>

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const marco = document.getElementById("marco");
const elBinario = document.getElementById("binario");
const elFrase = document.getElementById("frase");
const elFirma = document.getElementById("firma");
const btnRepetir = document.getElementById("repetir");

const img = new Image();
let W, H, dpr, celdas = [], celdaW, celdaH;
let animId, brilloId, timeouts = [], chispasId;

img.onload = () => { medir(); iniciar(); };
img.src = FOTO;

// ---------- Utilidades ----------
const mezcla = (a, b, t) => a + (b - a) * t;
const suave = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const espera = (fn, ms) => timeouts.push(setTimeout(fn, ms));

// Color final de los dígitos: de rosa profundo (sombras) a blanco cálido (luces)
function tono(l) {
  const t = l / 255;
  return [
    Math.round(mezcla(110, 255, t)),
    Math.round(mezcla(22, 236, Math.pow(t, 1.15))),
    Math.round(mezcla(58, 242, t)),
  ];
}

// ---------- Preparación ----------
function medir() {
  const maxAlto = window.innerHeight * 0.56;
  const maxAncho = Math.min(window.innerWidth - 32, 520);
  const escala = Math.min(maxAlto / img.height, maxAncho / img.width);
  W = Math.round(img.width * escala);
  H = Math.round(img.height * escala);
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  lienzo.width = W * dpr; lienzo.height = H * dpr;
  lienzo.style.width = W + "px"; lienzo.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.font = `500 ${TAM_LETRA}px "JetBrains Mono", "Courier New", monospace`;
  const anchoCar = ctx.measureText("0").width + 1;
  const altoCar = TAM_LETRA * 1.18;
  const cols = Math.max(1, Math.round(W / anchoCar));
  const filas = Math.max(1, Math.round(H / altoCar));
  celdaW = W / cols; celdaH = H / filas;

  // Foto reducida: un píxel por celda
  const mini = document.createElement("canvas");
  mini.width = cols; mini.height = filas;
  const m = mini.getContext("2d", { willReadFrequently: true });
  m.drawImage(img, 0, 0, cols, filas);
  const d = m.getImageData(0, 0, cols, filas).data;

  // Ecualización del histograma: resalta los rostros aunque el fondo sea muy claro
  const n = cols * filas;
  const lums = new Float32Array(n);
  const hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) {
    const l = .299 * d[i*4] + .587 * d[i*4+1] + .114 * d[i*4+2];
    lums[i] = l; hist[l | 0]++;
  }
  const acum = new Float32Array(256);
  let suma = 0;
  for (let v = 0; v < 256; v++) { suma += hist[v]; acum[v] = suma / n * 255; }

  celdas = [];
  for (let f = 0; f < filas; f++) {
    for (let c = 0; c < cols; c++) {
      const i = f * cols + c;
      const lum = acum[lums[i] | 0] * .7 + lums[i] * .3;  // mezcla para que no quede artificial
      const ang = Math.random() * Math.PI * 2;
      const fuerza = 10 + Math.random() * 34;
      celdas.push({
        x: c * celdaW, y: f * celdaH,
        lum,
        foto: [d[i*4], d[i*4+1], d[i*4+2]],
        fin: tono(lum),
        digito: Math.random() < .5 ? "0" : "1",
        // cuándo empieza a deshacerse (de arriba hacia abajo, con algo de azar)
        inicio: (f / filas) * .62 + Math.random() * .16,
        dx: Math.cos(ang) * fuerza,
        dy: Math.sin(ang) * fuerza - 18,   // tienden a flotar hacia arriba
        brillo: 0,
      });
    }
  }
}

// ---------- Dibujo ----------
const DURACION_CELDA = .22;  // fracción de la transición que tarda cada partícula

function pintar(p) {
  ctx.clearRect(0, 0, W, H);

  // 1. La foto, con los huecos de las celdas que ya se convirtieron
  if (p < 1) {
    ctx.drawImage(img, 0, 0, W, H);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    for (const c of celdas) {
      if (p > c.inicio) ctx.rect(c.x - .5, c.y - .5, celdaW + 1, celdaH + 1);
    }
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  // 2. Las partículas / dígitos
  ctx.font = `500 ${TAM_LETRA}px "JetBrains Mono", "Courier New", monospace`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const c of celdas) {
    if (p <= c.inicio) continue;
    const q = Math.min(1, (p - c.inicio) / DURACION_CELDA);
    const cx = c.x + celdaW / 2, cy = c.y + celdaH / 2;

    if (q < 1) {
      // Vuelo: sale disparada y regresa a su lugar
      const arco = Math.sin(Math.PI * suave(q));
      const x = cx + c.dx * arco;
      const y = cy + c.dy * arco;
      const t = suave(q);
      const r = mezcla(c.foto[0], c.fin[0], t);
      const g = mezcla(c.foto[1], c.fin[1], t);
      const b = mezcla(c.foto[2], c.fin[2], t);
      if (q < .3) {
        // primero es un punto de luz con el color de la foto
        const tam = mezcla(celdaW, 1.6, q / .3);
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},.95)`;
        ctx.fillRect(x - tam / 2, y - tam / 2, tam, tam);
      } else {
        if (c.lum < UMBRAL && q > .85) continue;
        const alfa = c.lum < UMBRAL ? 1 - (q - .3) / .7 : .5 + .5 * q;
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alfa})`;
        ctx.fillText(c.digito, x, y);
      }
    } else {
      if (c.lum < UMBRAL) continue;
      const k = c.brillo;
      const [r, g, b] = c.fin;
      ctx.fillStyle = k > 0
        ? `rgb(${mezcla(r,255,k)|0},${mezcla(g,255,k)|0},${mezcla(b,255,k)|0})`
        : `rgb(${r},${g},${b})`;
      ctx.fillText(c.digito, cx, cy);
    }
  }
}

// ---------- Secuencia ----------
function iniciar() {
  limpiar();
  document.body.classList.remove("digital");
  marco.classList.remove("visible");
  elBinario.innerHTML = ""; elFrase.innerHTML = "";
  elFirma.classList.remove("on");
  btnRepetir.classList.remove("on");
  for (const c of celdas) c.brillo = 0;

  pintar(0);
  requestAnimationFrame(() => marco.classList.add("visible"));
  espera(transformar, ESPERA_MS);
}

function transformar() {
  let t0 = null;
  document.body.classList.add("digital");
  const paso = t => {
    if (t0 === null) t0 = t;
    const p = Math.min(1, (t - t0) / TRANSICION_MS);
    // la transición total incluye el vuelo de la última partícula
    pintar(p * (1 + DURACION_CELDA) );
    if (p < 1) animId = requestAnimationFrame(paso);
    else { pintar(2); vivo(); mostrarMensaje(); }
  };
  animId = requestAnimationFrame(paso);
}

// Los dígitos siguen "respirando": cambian y destellan de vez en cuando
function vivo() {
  const tick = () => {
    for (let i = 0; i < celdas.length * .006; i++) {
      const c = celdas[(Math.random() * celdas.length) | 0];
      c.digito = c.digito === "0" ? "1" : "0";
      if (Math.random() < .35) c.brillo = 1;
    }
    for (const c of celdas) if (c.brillo > 0) c.brillo = Math.max(0, c.brillo - .12);
    pintar(2);
  };
  brilloId = setInterval(tick, 90);
}

function mostrarMensaje() {
  // 1. El código se escribe como en una terminal
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  const texto = document.createTextNode("");
  elBinario.append(texto, cursor);
  [...BINARIO].forEach((ch, i) => espera(() => { texto.data += ch; }, 600 + i * 140));
  const finBinario = 600 + BINARIO.length * 140;

  // 2. La frase aparece palabra por palabra, desenfocándose a nítida
  FRASE.split(" ").forEach((palabra, i, arr) => {
    const s = document.createElement("span");
    s.className = "p" + (PALABRAS_CLAVE.includes(palabra) ? " clave" : "");
    s.textContent = palabra;
    elFrase.append(s);
    if (i < arr.length - 1) elFrase.append(" ");
    espera(() => s.classList.add("on"), finBinario + 500 + i * 230);
  });
  const finFrase = finBinario + 500 + FRASE.split(" ").length * 230;

  // 3. La firma, discreta
  espera(() => { elFirma.classList.add("on"); cursor.remove(); }, finFrase + 1200);
  espera(() => { btnRepetir.classList.add("on"); chispas(); }, finFrase + 2600);
}

// Pequeños corazones y bits que suben por la pantalla
function chispas() {
  const simbolos = ["❤", "1", "0", "❤", "♡"];
  const lanzar = () => {
    const s = document.createElement("span");
    s.className = "chispa";
    s.textContent = simbolos[(Math.random() * simbolos.length) | 0];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 9 + Math.random() * 10 + "px";
    s.style.setProperty("--deriva", (Math.random() * 80 - 40) + "px");
    const dur = 7 + Math.random() * 6;
    s.style.animationDuration = dur + "s";
    document.body.append(s);
    setTimeout(() => s.remove(), dur * 1000);
  };
  chispasId = setInterval(lanzar, 700);
}

function limpiar() {
  cancelAnimationFrame(animId);
  clearInterval(brilloId); clearInterval(chispasId);
  timeouts.forEach(clearTimeout); timeouts = [];
  document.querySelectorAll(".chispa").forEach(e => e.remove());
}

btnRepetir.onclick = () => { medir(); iniciar(); };

// ---------- Lluvia binaria del fondo ----------
(() => {
  const c = document.getElementById("fondo");
  const g = c.getContext("2d");
  const tam = 14;
  let gotas = [];
  const ajustar = () => {
    c.width = innerWidth; c.height = innerHeight;
    gotas = Array.from({ length: Math.ceil(innerWidth / tam) }, () => Math.random() * -60);
  };
  ajustar();
  addEventListener("resize", ajustar);
  setInterval(() => {
    g.fillStyle = "rgba(7, 4, 10, .16)";
    g.fillRect(0, 0, c.width, c.height);
    g.font = `${tam}px "JetBrains Mono", monospace`;
    gotas.forEach((y, i) => {
      g.fillStyle = Math.random() < .03 ? "rgba(255,180,200,.35)" : "rgba(255,92,138,.12)";
      g.fillText(Math.random() < .5 ? "0" : "1", i * tam, y * tam);
      gotas[i] = y * tam > c.height && Math.random() > .975 ? 0 : y + 1;
    });
  }, 70);
})();

// Si cambia el tamaño de la ventana, se rehace todo
let reajuste;
addEventListener("resize", () => {
  clearTimeout(reajuste);
  reajuste = setTimeout(() => { if (img.complete) { medir(); iniciar(); } }, 300);
});
</script>
